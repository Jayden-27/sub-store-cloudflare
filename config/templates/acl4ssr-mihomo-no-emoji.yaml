# ACL4SSR Mihomo 无 Emoji (mihomo)
# Generated from cloudflare/src/lib/defaults.ts. Do not edit by hand; edit the source and rerun templates:export.
mixedPort: 7890
allowLan: false
mode: rule
logLevel: info
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
proxyGroups:
  - name: 节点选择
    type: select
    proxies:
      - 自动选择
      - 手动切换
      - DIRECT
  - name: 自动选择
    type: url-test
    proxies:
      - $all
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 手动切换
    type: select
    proxies:
      - $all
  - name: 国外媒体
    type: select
    proxies:
      - 节点选择
      - 自动选择
      - 手动切换
      - DIRECT
  - name: AI 服务
    type: select
    proxies:
      - 节点选择
      - 自动选择
      - 手动切换
      - DIRECT
  - name: 微软服务
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - 自动选择
  - name: 苹果服务
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - 自动选择
  - name: 全球直连
    type: select
    proxies:
      - DIRECT
      - 节点选择
  - name: 全球拦截
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: 漏网之鱼
    type: select
    proxies:
      - 节点选择
      - DIRECT
ruleProviders:
  LocalAreaNetwork:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
